<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ЖЭУ</title>
</head>

<body>
  <script>
    const token = localStorage.getItem("access_token");
    const role = localStorage.getItem("role");

    if (!token) {
      window.location.href = "/login";
    } else if (role === "admin") {
      window.location.href = "/admin";
    } else {
      window.location.href = "/dashboard";
    }
  </script>
</body>
</html>
