<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Личный кабинет | ЖЭУ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="page-background">
  <div class="navbar app-navbar px-6">
    <div class="flex-1">
      <a class="text-xl font-bold" href="/dashboard">ЖЭУ</a>
    </div>

    <div class="flex-none gap-3">
      <div class="text-right hidden sm:block">
        <div id="currentUser" class="font-semibold">Пользователь</div>
        <div id="currentRole" class="text-sm opacity-60">resident</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="logout()">Выйти</button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-4 lg:p-8">
    <section class="mb-6 app-page-title">
      <h1 class="text-3xl font-bold">Личный кабинет</h1>
      <p>Новости, заявки и уведомления по вашему дому</p>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="card app-card lg:col-span-1">
        <div class="card-body">
          <h2 class="card-title">Профиль</h2>
          <div class="space-y-2 text-sm">
            <p><span class="font-semibold">Email:</span> <span id="profileEmail">-</span></p>
            <p><span class="font-semibold">Username:</span> <span id="profileUsername">-</span></p>
            <p><span class="font-semibold">Роль:</span> <span id="profileRole">-</span></p>
          </div>
        </div>
      </div>

      <div class="card app-card lg:col-span-2">
        <div class="card-body">
          <h2 class="card-title">Новости</h2>
          <div id="newsList" class="space-y-3"></div>
        </div>
      </div>

      <div class="card app-card lg:col-span-1">
        <div class="card-body">
          <h2 class="card-title">Создать заявку</h2>

          <form onsubmit="createRequest(event)" class="space-y-4">
            <label class="form-control">
              <div class="label">
                <span class="label-text">Заголовок</span>
              </div>
              <input id="requestTitle" type="text" class="input input-bordered" required />
            </label>

            <label class="form-control">
              <div class="label">
                <span class="label-text">Описание</span>
              </div>
              <textarea id="requestContent" class="textarea textarea-bordered min-h-28" required></textarea>
            </label>

            <p id="requestError" class="text-error text-sm min-h-5"></p>

            <button class="btn btn-primary w-full" type="submit">
              Создать заявку
            </button>
          </form>
        </div>
      </div>

      <div class="card app-card lg:col-span-1">
        <div class="card-body">
          <h2 class="card-title">Мои заявки</h2>
          <div id="requestsList" class="space-y-3"></div>
        </div>
      </div>

      <div class="card app-card lg:col-span-1">
        <div class="card-body">
          <h2 class="card-title">
            Уведомления
            <span id="notificationsBadge" class="badge badge-primary hidden">0</span>
          </h2>
          <div id="notificationsList" class="space-y-3"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast toast-top toast-end z-50"></div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/news.js"></script>
  <script src="/js/requests.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
