server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index pages/login.html;

    location = / {
        try_files /pages/login.html =404;
    }

    location = /login {
        try_files /pages/login.html =404;
    }

    location = /register {
        try_files /pages/register.html =404;
    }

    location = /dashboard {
        try_files /pages/dashboard.html =404;
    }

    location = /admin {
        try_files /pages/admin.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index pages/login.html;

    location / {
        try_files $uri $uri/ /pages/login.html;
    }
}

